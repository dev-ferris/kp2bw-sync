name: Docker image

# Builds the image for amd64 and arm64 and publishes it to
#   - GitHub Container Registry: ghcr.io/<owner>/<repo>
#   - Docker Hub:                docker.io/<DOCKERHUB_USERNAME>/<repo>
#
# Required in the repository settings (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  Docker Hub user or namespace (repository variable or secret)
#   DOCKERHUB_TOKEN     Docker Hub access token (repository secret); Read & Write is
#                       enough here, dockerhub-readme.yml needs Read, Write, Delete
# Both must be defined at repository level ("Repository secrets/variables"),
# not only inside an environment.
# For GHCR the automatic GITHUB_TOKEN is sufficient.
#
# Tags:
#   Push to main / weekly rebuild  → latest, sha-<short>, kp2bw-<version>
#   Git tag v1.2.3                  → 1.2.3, 1.2, 1, latest
#   Pull request                    → build only, nothing is published

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - .dockerignore
      - "*.sh"
      - "*.py"
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
  schedule:
    # Rebuild weekly so security updates of the base images are picked up
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      # Username may be defined as a variable or as a secret
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read versions from the Dockerfile
        id: versions
        run: |
          echo "kp2bw=$(sed -n 's/^ARG KP2BW_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "bwcli=$(sed -n 's/^ARG BW_CLI_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Publish?
        id: publish
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          # Docker Hub only if username and token are configured
          missing=""
          [ -n "$DOCKERHUB_USER" ]  || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -z "$missing" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub: enabled"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub skipped, not found at repository level:$missing"
          fi

      - name: QEMU (for arm64)
        uses: docker/setup-qemu-action@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true' && steps.publish.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.publish.outputs.dockerhub }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=kp2bw-${{ steps.versions.outputs.kp2bw }},enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=kp2bw-sync
            org.opencontainers.image.description=KeePass → Vaultwarden sync (kp2bw ${{ steps.versions.outputs.kp2bw }}, Bitwarden CLI ${{ steps.versions.outputs.bwcli }})

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          # Always pull fresh base images; weekly rebuilds also skip the cache
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test (amd64)
        if: steps.publish.outputs.enabled == 'true'
        run: |
          IMAGE="${{ env.GHCR_IMAGE }}:sha-${GITHUB_SHA::7}"
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'node --version && HTTPS_PROXY=http://127.0.0.1:9 bw --version 2>/dev/null && kp2bw --version && python3 -c "import pykeepass"'
